<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.png" />

  <title>Push Test</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    main {
      width: min(100%, 430px);
      padding: 28px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #1e293b;
    }

    h1 { margin-top: 0; }

    p {
      line-height: 1.5;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #addDevice {
      background: #22c55e;
      color: #052e16;
    }

    #sendNow {
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <main>
    <h1>Push Test</h1>

    <p>
      Add this device to receive one Web Push notification every 30 minutes.
    </p>

    <p id="status">Loading…</p>

    <button id="addDevice">Add this device</button>
    <button id="sendNow" disabled>Send test now</button>

    <p>
      iPhone users: open in Safari, select <strong>Share → Add to Home Screen</strong>,
      launch it from the Home Screen, then press the green button.
    </p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
